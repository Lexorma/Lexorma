# 개발 서버
spring:
  datasource:
    url: jdbc:postgresql://metamora-postgres:5432/metamora?charSet=UTF-8&reWriteBatchedInserts=true
    username: metamora
    password: metamora
  jpa:
    properties:
      hibernate:
        ejb:
          metamodel:
            population: enabled
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true

server:
  port: 18080

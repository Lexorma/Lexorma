# 자동화 테스트 (PostgreSQL 전용 — DB-1). 테스트 전용 설정 키로만 DB 를 정한다 (일반 SPRING_DATASOURCE_* · 개발/운영 프로필을 쓰지 않는다) :
#   LEXORMA_TEST_POSTGRES_URL      = jdbc:postgresql://<호스트>:<포트>/<이름에 test 가 들어간 빈 DB>   (필수)
#   LEXORMA_TEST_POSTGRES_USER     = 테스트 전용 계정 권장                                             (필수)
#   LEXORMA_TEST_POSTGRES_PASSWORD = 그 계정의 비밀번호 (인증 방식에 따라 비울 수 있다)
# TestDatabaseGuard 가 DataSource·Flyway 보다 먼저 확인하고, 맞지 않으면 그 테스트 컨텍스트를 띄우지 않는다. DB 가 필요 없는 단위 테스트는 이 설정 없이 돈다.
# 기동 때 Flyway 가 그 DB 에 스키마·예제 데이터를 만든다 (매번 새 빈 DB 를 권장).
spring:
  # 운영 마이그레이션 + 테스트 전용 콜백 (db/test-account : 예전 기본 관리자 계정 admin/admin 을 넣는다, 운영 초기 데이터에는 없다)
  flyway:
    locations: classpath:db/migration/postgresql,classpath:db/test-account
  datasource:
    url: ${LEXORMA_TEST_POSTGRES_URL:}
    username: ${LEXORMA_TEST_POSTGRES_USER:}
    password: ${LEXORMA_TEST_POSTGRES_PASSWORD:}
    # 테스트 컨텍스트 캐시는 구성이 다른 컨텍스트를 모두 살려 두고, Hikari 기본값(minimum-idle = maximum-pool-size = 10)이면 컨텍스트마다
    # 유휴 연결 10개를 계속 잡는다. 컨텍스트 9개에서 max_connections(100)에 닿아 'too many clients' 가 난다 (누수 아님).
    # 쓰지 않는 컨텍스트는 10초 뒤 1개만 남긴다. 최대 크기는 기본(10) 그대로 (동시성 테스트용)
    hikari:
      minimum-idle: 1
      idle-timeout: 10000
  # 실제 UPDATE SQL 확인용 (SqlCapture : 켜 둔 동안만 모으고 SQL 은 바꾸지 않는다)
  jpa:
    properties:
      hibernate:
        session_factory:
          statement_inspector: com.lexorma.SqlCapture

# API 문서 생성도 회귀 확인 대상에 포함 (springdoc 업그레이드 대비)
springdoc:
  api-docs:
    enabled: true

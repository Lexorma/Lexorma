# 스모크 테스트 전용 (H2 In-Memory) : 기동 시마다 Flyway로 스키마/초기 데이터 새로 생성
spring:
  # 운영 마이그레이션 + 테스트 전용 콜백 (db/test-account : 예전 기본 관리자 계정 admin/admin 을 넣는다, 운영 초기 데이터에는 없다)
  flyway:
    locations: classpath:db/migration/{vendor},classpath:db/test-account
  datasource:
    url: jdbc:h2:mem:lexorma-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: lexorma
    password: lexorma
    # 테스트 컨텍스트 캐시는 구성이 다른 컨텍스트를 모두 살려 두고, Hikari 기본값(minimum-idle = maximum-pool-size = 10)이면 컨텍스트마다
    # 유휴 연결 10개를 계속 잡는다. PostgreSQL 로 돌리면 컨텍스트 9개에서 max_connections(100)에 닿아 'too many clients' 가 난다 (누수 아님).
    # 쓰지 않는 컨텍스트는 10초 뒤 1개만 남긴다. 최대 크기는 기본(10) 그대로 (동시성 테스트용)
    hikari:
      minimum-idle: 1
      idle-timeout: 10000
  # 실제 UPDATE SQL 확인용 (SqlCapture : 켜 둔 동안만 모으고 SQL 은 바꾸지 않는다)
  jpa:
    properties:
      hibernate:
        session_factory:
          statement_inspector: com.lexorma.SqlCapture

# API 문서 생성도 회귀 확인 대상에 포함 (springdoc 업그레이드 대비)
springdoc:
  api-docs:
    enabled: true

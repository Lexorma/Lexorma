# ErrorCode messages (English) : the key is the code of ErrorCode. UTF-8

UNKNOWN-EXCEPTION=An unknown error occurred.
PASSWORD-NOT-MATCHED=The password does not match.
CREATE_EXCEL_FAIL_EXCEPTION=Failed to create the Excel file.
USERNAME_IS_DUPLICATION=This username is already registered.
PASSWORD_IS_NON_VALIDATOR=The password must be at least 8 characters long and include at least one uppercase letter and one special character.
USERNAME_IS_NON_VALIDATOR=The username must be 5 to 20 characters of lowercase letters, numbers and underscores (_). It cannot start or end with an underscore or contain consecutive underscores.
DUPLICATE_TERM_DATA=A standard term with the same standard domain already exists. Duplicate terms cannot be registered.
NOT_FOUND_TERM_DATA=The term could not be found.
NOT_FOUND_WORD_DATA=Some words of the term are not mapped to standard words.
WORD_UNDERSCORE_NOT_ALLOWED=Standard word names and their English abbreviations cannot contain '_'. ('_' separates the words of a standard term)
TERM_WORD_COUNT_MISMATCH=The standard term name and its English abbreviation have a different number of words (separated by '_'). (e.g. 사용자_이름 / USER_NM)
TABLE_WORD_NOT_STANDARD=The table comment contains words that are not approved standard words.
TABLE_KOR_NAME_REQUIRED=Enter the table comment.
INVALID_TABLE_PREFIX=The table name prefix must start with a letter and contain only letters, numbers and _. (up to 20 characters)
APPROVED_DATA_CANNOT_BE_DELETED=Approved data cannot be deleted.
RELATION_EXISTS=Data that is in use cannot be deleted.
NOT_FOUND_DOMAIN_DATA=The domain could not be found.
DATA_CANNOT_BE_DELETED=You do not have permission to perform this action.
SAVED_DATA_EXISTS=The data already exists.
COLUMN_DUPLICATE_IN_FILE=The uploaded Excel file contains the same column name more than once for a table.
COLUMN_DEPENDENCY_EXISTS=It cannot be deleted because it is registered as a column.
TABLE_IS_NOT_DEFINED=The table is not registered.
COLUMN_BOOLEAN_TYPE_DEF=Nullable, required, sensitive, PK, unique, create index and needs encryption must be Y or N.
TERM_IS_NOT_DEFINED=The standard term is not registered.
APPROVED_DATA_CANNOT_BE_UPDATE=Approved data cannot be edited.
SYSTEM_NOTICE_CANNOT_BE_UPDATE=Notices registered by the system cannot be edited.
DOMAIN_IS_NOT_DEFINED=The standard domain category you entered could not be found.
MANAGER_NON_DELETED=Managers cannot be changed.
LOGIN_FAILED=The username or password is incorrect.
NO_ACCESSIBLE_PROJECT=There are no projects this account can access.
COMMON_COLUMN_PERMISSION_DENIED=Only project managers can change the common column set.
COMMON_COLUMN_DUPLICATED=The common column set contains the same column name more than once.
COMMON_COLUMN_TOO_MANY=The common column set has too many columns.
PASSWORD_CHANGE_REQUIRED=You are using the initial password. Change your password and sign in again.
SCHEMA_IS_NOT_DEFINED=The schema is not registered.
INVALID_SCHEMA_NAME=The schema name must start with a letter or _ and contain only letters, numbers, _ and $. (up to 63 characters)
SCHEMA_PERMISSION_DENIED=Only administrators, managers and project managers can change schemas.
APPROVAL_PERMISSION_DENIED=Only administrators, managers and project managers can approve or cancel an approval.
INVALID_PHYSICAL_MODEL=The relation, index or constraint definition is invalid.
INVALID_LOGICAL_MODEL=The logical model definition is invalid.
LOGICAL_MODEL_IS_NOT_DEFINED=The logical model data does not exist.
INVALID_MODEL_MAPPING=The logical-physical mapping is invalid.
MODEL_MAPPING_IS_NOT_DEFINED=The logical-physical mapping does not exist.
INVALID_ERD_REQUEST=The ERD query condition or layout is invalid.
ERD_LAYOUT_CONFLICT=The layout was saved in another window first. Load the saved layout again and then save.
PASSWORD_NOT_CHANGED=The new password must be different from your current password and username.

# Authentication / authorization / common (response codes outside ErrorCode : JsonResponses.error, GlobalExceptionHandler)
PROJECT_ACCESS_DENIED=You cannot access the selected project.
DUPLICATE_LOGIN=You have been signed out because this account signed in elsewhere. Please sign in again.
INVALID_CREDENTIALS=The username or password is incorrect.
PROJECT_ACCESS_REVOKED=You can no longer access the current project. Please sign in again.
UNAUTHORIZED=Login is required.
CSRF_INVALID=The security token has expired or is invalid. Please try again.
ACCESS_DENIED=You do not have access.
NOT_FOUND=The requested resource could not be found.
PROJECT_NOT_FOUND=The project could not be found.
INVALID_MODEL_VERSION=The model version request is invalid.
MODEL_VERSION_NOT_FOUND=Model version not found.
LAST_ACTIVE_PROJECT=Deactivating this project leaves no active project. Regular users will not be able to sign in, and it can only be reactivated through a system ADMIN recovery sign-in.
NO_RECOVERY_ADMIN=This cannot be done because there is no active ADMIN account that could use the recovery sign-in.
RECOVERY_LOGIN_DENIED=Recovery sign-in is not available. Only a system administrator can use it, and only while there is no active project.
SECRET_KEY_NOT_CONFIGURED=This feature is unavailable because the secret encryption key is not configured. Please contact your administrator.
SECRET_KEY_NOT_FOUND=The encryption key for the stored credentials is not available. Please register the credentials again.
SECRET_DECRYPT_FAILED=The stored credentials could not be read. Please register the credentials again.
EXECUTION_PERMISSION_DENIED=You do not have permission to run this task.
SOURCE_CONNECTION_NOT_FOUND=External database connection not found.
INVALID_SOURCE_CONNECTION=The external database connection is invalid.
SOURCE_OBJECT_NOT_FOUND=The object could not be found in the source catalog.
INVALID_SOURCE_CATALOG=The content to store in the source catalog is invalid.
SOURCE_TOOL_NOT_AVAILABLE=The source database tool cannot be run.
SOURCE_COLLECTION_NOT_FOUND=Source catalog collection job not found.
SOURCE_COLLECTION_IN_PROGRESS=A collection is already in progress for this connection.
SOURCE_COLLECTION_NOT_RUNNING=The collection job is not in progress.
SOURCE_COLLECTION_INCOMPLETE=The collection result is incomplete and was not applied.
SOURCE_COLLECTION_ABANDONED=The collection job was stopped because the server running it stopped responding.
SOURCE_CONNECT_TIMEOUT=Connecting to the source database timed out.
SOURCE_CONNECT_FAILED=Could not connect to the source database.
SOURCE_AUTH_FAILED=The source database rejected the credentials.
SOURCE_PERMISSION_DENIED=The source database account is not allowed to read the metadata.
SOURCE_TLS_FAILED=The TLS connection or certificate verification with the source database failed.
SOURCE_DRIVER_NOT_AVAILABLE=The JDBC driver for this database type is not available.
SOURCE_HOST_NOT_ALLOWED=Connecting to this address is not allowed. Only destinations allowed by an administrator (External connection security) can be used.
SOURCE_QUERY_TIMEOUT=Reading metadata from the source database timed out.
SOURCE_METADATA_FAILED=Could not read metadata from the source database.
SOURCE_CHANGED_DURING_COLLECTION=The source database structure changed during collection. Please collect again.
SOURCE_CANCELLED=The collection was cancelled.
SOURCE_COLLECTION_TIMEOUT=The collection was stopped because it exceeded the time limit.
SOURCE_COLLECTION_REJECTED=The collection job could not be accepted right now. Please try again later.
SOURCE_TEST_RATE_LIMITED=Too many connection test requests. Please try again later.
SOURCE_MAPPING_INVALID=The source mapping cannot be confirmed.
SOURCE_MAPPING_CONFLICT=The request conflicts with a source mapping or needs confirmation.
SOURCE_COMPARE_STALE=The comparison basis (base connection or collection) has changed. Refresh and check again.
SOURCE_IMPORT_INVALID=The import request cannot be processed.
CONNECTION_RULE_INVALID=The external connection rule is not valid.
CONNECTION_RULE_NOT_FOUND=The external connection rule was not found.
EXTERNAL_CONNECTION_BLOCKED=The external connection was not made because the administrator has not allowed it.
EXTERNAL_CONNECTION_AUDIT_FAILED=The connection was not made because the attempt could not be recorded in the audit log. Try again later.
AI_PROVIDER_NOT_FOUND=The AI provider could not be found.
AI_PROVIDER_INVALID=The AI provider settings are invalid.
AI_PROVIDER_DISABLED=The AI provider is disabled.
AI_PROVIDER_UNSUPPORTED=The AI provider type or feature is not supported.
AI_PROVIDER_CALL_FAILED=The AI server could not be called.
AI_DEFAULT_PROVIDER_NOT_CONFIGURED=No system default AI provider is set. Ask an administrator to set a default provider in AI provider management.
AI_DEFAULT_PROVIDER_MODEL_MISSING=The system default AI provider has no default model.
AI_PROVIDER_IN_USE=The provider is the system default AI provider and cannot be deleted. Clear the default or set another provider as the default first.

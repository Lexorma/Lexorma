name: Bug report
description: Report a bug you found while using MetaMora.
title: "[Bug] "
labels: [bug]

body:
  - type: input
    id: version
    attributes:
      label: MetaMora version
      placeholder: e.g. v1.0.0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Describe the problem in as much detail as you can.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and anything else relevant.
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Additional context
      description: Attach screenshots, error logs, and so on.
    validations:
      required: false

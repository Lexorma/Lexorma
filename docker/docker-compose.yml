services:
  lexorma-postgres:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_PASSWORD: lexorma
      POSTGRES_DB: lexorma
      POSTGRES_USER: lexorma
    ports:
      - 15439:5432
    volumes:
      - ./volume/lexorma:/var/lib/postgresql
    container_name: lexorma-postgres
    networks:
      - lexorma-network

networks:
  lexorma-network:
    driver: bridge

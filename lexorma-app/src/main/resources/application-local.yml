# 로컬 개발 : docker/docker-compose.yml 의 Postgres (localhost:15439)
spring:
  # DevTools 자동 재시작 끔 (로컬 프로필만) : IDE 에서 앱을 띄워 둔 채 Gradle 빌드·테스트를 하면 build/resources 가 바뀌어 재시작되고,
  # 그때 Flyway 가 새 마이그레이션을 개발 DB 에 바로 적용했다 (2026-11-14 V3). 새 마이그레이션은 앱을 직접 다시 띄울 때만 적용된다 — 절차는 README "Database migrations".
  # IDE 의 HotSwap(클래스 다시 읽기)은 그대로 쓸 수 있다. 다시 켜려면 실행 설정에 --spring.devtools.restart.enabled=true
  devtools:
    restart:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:15439/lexorma?charSet=UTF-8&reWriteBatchedInserts=true
    username: lexorma
    password: lexorma
  jpa:
    properties:
      hibernate:
        ejb:
          metamodel:
            population: enabled
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 비밀값 암호화 키 : 로컬 개발 전용 고정 키 (local · h2-local 프로필에만 있다, Git 에 포함).
# 공개된 키라 실제 운영 데이터·운영 비밀번호에 쓰지 않는다. 다른 프로필(dev · docker · h2-docker)에는 적용되지 않는다.
# 자기 키를 쓰려면 LEXORMA_SECRET_KEYS (/ LEXORMA_SECRET_ACTIVE_KEY_ID) 환경변수로 덮어쓴다 (환경변수가 이 값보다 우선).
# 활성 키ID 는 일부러 두지 않는다 (목록의 맨 앞 키) — 환경변수로 키 목록만 바꿔도 그 키가 활성이 된다
lexorma:
  secret:
    keys: "local:bGV4b3JtYS1sb2NhbC1kZXYta2V5LW5vdC1zZWNyZXQ="

<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MetaMora</title>
    <meta name="description" content="MetaMora는 메타데이터를 관리하고 표준화하는 시스템입니다."/>

    <!-- Open Graph 메타태그 (카카오톡, 페북 등 미리보기용) -->
    <meta property="og:title" content="MetaMora - 메타데이터 표준관리 플랫폼"/>
    <meta property="og:description" content="데이터 표준화를 위한 설계부터 관리까지, MetaMora에서 한 번에 해결하세요!"/>
    <meta property="og:image" content="https://raw.githubusercontent.com/koboolean/metamora/main/metamora-web/public/images/og-image.png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:type" content="website"/>

    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg"/>
    <link rel="icon" type="image/png" href="/images/favicon.png"/>
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png"/>

    <!-- 사이드바 접힘 상태를 렌더링 전에 반영 (깜빡임 방지) -->
    <script>
        try {
            if (localStorage.getItem('sidebarCollapsed') === 'true') {
                document.documentElement.classList.add('sidebar-collapsed');
            }
        } catch (e) {}
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>

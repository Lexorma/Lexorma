# ErrorCode 메시지 (한국어) : 키는 ErrorCode 의 code. 파일 인코딩은 UTF-8

UNKNOWN-EXCEPTION=알수없는 오류가 발생하였습니다.
PASSWORD-NOT-MATCHED=패스워드가 일치하지 않습니다.
CREATE_EXCEL_FAIL_EXCEPTION=엑셀 생성이 실패하였습니다.
USERNAME_IS_DUPLICATION=등록된 아이디가 존재합니다.
PASSWORD_IS_NON_VALIDATOR=비밀번호는 8자 이상, 대문자 및 특수문자를 각각 하나 이상 포함해야 합니다.
USERNAME_IS_NON_VALIDATOR=아이디는 5~20자 사이의 소문자, 숫자, 밑줄(_)로 구성할 수 있습니다. 단, 밑줄은 처음과 끝에 사용할 수 없으며 연속된 밑줄도 허용되지 않습니다.
DUPLICATE_TERM_DATA=동일한 형식의 표준 용어와 표준 도메인이 존재합니다. 중복된 용어는 등록이 불가능합니다.
NOT_FOUND_TERM_DATA=해당 용어를 찾을 수 없습니다.
NOT_FOUND_WORD_DATA=등록 용어중 매핑되지 않는 단어가 존재합니다.
WORD_UNDERSCORE_NOT_ALLOWED=표준단어명과 표준단어영문약어명에는 '_' 를 쓸 수 없습니다. ('_' 는 표준용어의 단어 구분자입니다)
TERM_WORD_COUNT_MISMATCH=표준용어명과 표준용어영문약어명의 단어 수('_' 기준)가 다릅니다. (예: 사용자_이름 / USER_NM)
TABLE_WORD_NOT_STANDARD=테이블 한글명 중 승인된 표준 단어가 아닌 단어가 존재합니다.
TABLE_KOR_NAME_REQUIRED=테이블 한글명을 입력해주세요.
INVALID_TABLE_PREFIX=테이블명 접두어는 영문으로 시작하고 영문/숫자/_ 만 사용할 수 있습니다. (최대 20자)
APPROVED_DATA_CANNOT_BE_DELETED=승인된 정보는 삭제할 수 없습니다.
RELATION_EXISTS=사용 중인 정보는 삭제할 수 없습니다.
NOT_FOUND_DOMAIN_DATA=해당 도메인을 찾을 수 없습니다.
DATA_CANNOT_BE_DELETED=권한이 없어 작업을 수행할 수 없습니다.
SAVED_DATA_EXISTS=저장된 데이터가 존재합니다.
COLUMN_DUPLICATE_IN_FILE=업로드한 엑셀에 같은 테이블의 같은 컬럼명이 중복되어 있습니다.
COLUMN_DEPENDENCY_EXISTS=컬럼으로 등록된 정보가 존재하기 때문에 삭제가 불가능합니다.
TABLE_IS_NOT_DEFINED=등록된 테이블 정보가 존재하지 않습니다.
COLUMN_BOOLEAN_TYPE_DEF=NULL 허용여부, 필수 입력 여부, 민감정보 여부, PK 여부, 고유값 여부, 인덱스 생성 여부, 암호화 필요 여부는 Y 또는 N 값이어야합니다.
TERM_IS_NOT_DEFINED=등록된 표준용어 정보가 존재하지 않습니다.
APPROVED_DATA_CANNOT_BE_UPDATE=승인된 정보는 수정이 불가능합니다.
SYSTEM_NOTICE_CANNOT_BE_UPDATE=시스템이 등록한 공지사항은 수정이 불가능합니다.
DOMAIN_IS_NOT_DEFINED=입력하신 표준도메인분류명을 찾을 수 없습니다.
MANAGER_NON_DELETED=관리자는 변경이 불가능합니다.
LOGIN_FAILED=아이디 또는 비밀번호가 잘못되었습니다.
NO_ACCESSIBLE_PROJECT=해당 아이디로 접근 가능한 프로젝트가 없습니다.
COMMON_COLUMN_PERMISSION_DENIED=공통 컬럼 세트는 프로젝트 관리자만 변경할 수 있습니다.
COMMON_COLUMN_DUPLICATED=공통 컬럼 세트에 같은 컬럼명이 중복되어 있습니다.
COMMON_COLUMN_TOO_MANY=공통 컬럼 세트에 등록할 수 있는 개수를 넘었습니다.
PASSWORD_CHANGE_REQUIRED=초기 비밀번호를 사용 중입니다. 비밀번호를 변경한 뒤 로그인해주세요.
SCHEMA_IS_NOT_DEFINED=등록된 스키마 정보가 존재하지 않습니다.
INVALID_SCHEMA_NAME=스키마명은 영문 또는 _ 로 시작하고 영문/숫자/_/$ 만 사용할 수 있습니다. (최대 63자)
SCHEMA_PERMISSION_DENIED=스키마는 관리자·매니저·프로젝트 관리자만 변경할 수 있습니다.
APPROVAL_PERMISSION_DENIED=승인·승인취소는 관리자·매니저·프로젝트 관리자만 할 수 있습니다.
INVALID_PHYSICAL_MODEL=관계·인덱스·제약조건 정의가 올바르지 않습니다.
INVALID_ERD_REQUEST=ERD 조회 조건 또는 배치 정보가 올바르지 않습니다.
ERD_LAYOUT_CONFLICT=다른 창에서 배치가 먼저 저장되었습니다. 저장된 배치를 다시 불러온 뒤 저장해주세요.
PASSWORD_NOT_CHANGED=새 비밀번호는 현재 비밀번호 및 아이디와 달라야 합니다.

# 인증 / 권한 / 공통 (ErrorCode 가 아닌 응답 code : JsonResponses.error, GlobalExceptionHandler)
PROJECT_ACCESS_DENIED=선택한 프로젝트에 접근할 수 없습니다.
DUPLICATE_LOGIN=다른 곳에서 로그인하여 로그아웃되었습니다. 다시 로그인해주세요.
INVALID_CREDENTIALS=아이디 또는 비밀번호가 잘못되었습니다.
PROJECT_ACCESS_REVOKED=현재 프로젝트에 더 이상 접근할 수 없습니다. 다시 로그인해주세요.
UNAUTHORIZED=로그인이 필요합니다.
CSRF_INVALID=보안 토큰이 만료되었거나 올바르지 않습니다. 다시 시도해주세요.
ACCESS_DENIED=접근 권한이 없습니다.
NOT_FOUND=요청한 리소스를 찾을 수 없습니다.

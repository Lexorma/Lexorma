# Docker 이미지 (Dockerfile 의 기본 프로필). 관리 DB 접속 정보는 기본값 없이 환경변수로만 받는다 :
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<호스트>:5432/<DB>, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD (또는 Docker Secret 파일 spring.datasource.password)
spring:
  jpa:
    properties:
      hibernate:
        ejb:
          metamodel:
            population: enabled
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true

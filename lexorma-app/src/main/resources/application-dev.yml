# 개발 서버
spring:
  datasource:
    url: jdbc:postgresql://lexorma-postgres:5432/lexorma?charSet=UTF-8&reWriteBatchedInserts=true
    username: lexorma
    password: lexorma
  jpa:
    properties:
      hibernate:
        ejb:
          metamodel:
            population: enabled
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true

server:
  port: 18080

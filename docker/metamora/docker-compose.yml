services:
  metamora-postgres:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_PASSWORD: metamora
      POSTGRES_DB: metamora
      POSTGRES_USER: metamora
    ports:
      - 15439:5432
    volumes:
      - ../volume/metamora:/var/lib/postgresql
    container_name: metamora-postgres
    networks:
      - metamora-network

  metamora-app:
    image: koboolean/metamora
    container_name: metamora-app
    depends_on:
      - metamora-postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://metamora-postgres:5432/metamora?charSet=UTF-8&reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: metamora
      SPRING_DATASOURCE_PASSWORD: metamora
    volumes:
      - ../volume/h2:/data
    ports:
      - 9940:9940
    networks:
      - metamora-network

networks:
  metamora-network:
    driver: bridge

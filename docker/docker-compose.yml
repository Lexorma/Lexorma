services:
  lexorma-postgres:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_PASSWORD: metamora
      POSTGRES_DB: metamora
      POSTGRES_USER: metamora
    ports:
      - 15439:5432
    volumes:
      - ./volume/metamora:/var/lib/postgresql
    container_name: lexorma-postgres
    networks:
      - metamora-network

networks:
  metamora-network:
    driver: bridge

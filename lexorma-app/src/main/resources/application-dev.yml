# 개발 서버 (Dockerfile.dev, 포트 18080). DB 연결 정보는 프로필이 주지 않는다 (DB-1 PG-D37) — 컨테이너에 SPRING_DATASOURCE_URL · _USERNAME (· _PASSWORD) 를 준다
spring:
  jpa:
    properties:
      hibernate:
        ejb:
          metamodel:
            population: enabled
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true

server:
  port: 18080
